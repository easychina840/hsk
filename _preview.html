<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>모바일 확인용</title>
<style>
  html,body{margin:0;background:#dfd8d0}
  iframe{width:390px;border:0;display:block;background:#fff}
</style></head>
<body>
<iframe id="f" src="hsk6.html"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var l = q.get('l') || '6';
  var b = q.get('b') || Date.now();
  var f = q.get('f');
  var h = q.get('h') || '664';
  document.getElementById('f').style.height = h + 'px';
  document.getElementById('f').src = f ? (f + '?b=' + b) : ('hsk' + l + '.html?b=' + b);
</script>
</body></html>
